<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Not Found | felps.dev</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0e0c;
        --ink: #ece7dc;
        --ink-secondary: #a69d8b;
        --ink-muted: #71695a;
        --accent: #d9a45b;
        --rule-strong: #38321f;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Newsreader", Georgia, serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        max-width: 28rem;
        text-align: center;
      }

      .code {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 2.4rem;
        font-weight: 500;
        line-height: 1.15;
        margin-bottom: 1rem;
      }

      h1 em {
        font-style: italic;
        font-weight: 400;
        color: var(--ink-secondary);
      }

      p {
        color: var(--ink-secondary);
        line-height: 1.65;
        margin-bottom: 2rem;
      }

      a {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.85rem;
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--rule-strong);
        text-underline-offset: 4px;
        transition: color 0.2s ease, text-decoration-color 0.2s ease;
      }

      a:hover {
        color: var(--accent);
        text-decoration-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">Error 404</p>
      <h1>This page <em>doesn't exist.</em></h1>
      <p>
        Maybe it moved, maybe it never shipped. Either way, there's nothing
        here — but the rest of the site is one click away.
      </p>
      <a href="/">← back to felps.dev</a>
    </div>
  </body>
</html>
