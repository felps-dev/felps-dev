; Upload limits for lsapi/PHP-FPM (LiteSpeed reads this file per directory).
; The code validates the same limits again: a host may cap these lower, or may
; ignore the file entirely (mod_php does), and the API still has to behave.
upload_max_filesize = 25M
post_max_size = 120M
; PHP_INI_SYSTEM: only the host's php.ini can change this one, so the line
; below is a no-op on lsphp. upload.php reports it when a batch hits it.
max_file_uploads = 25
max_execution_time = 120
memory_limit = 256M
display_errors = 0
log_errors = 1
; No error_log path here on purpose: a relative one would resolve against the
; script's CWD and swallow startup errors. The API points PHP at
; data/php-errors.log at runtime, and .htaccess denies any error_log /
; php_errorlog file lsphp may still drop inside the web root.
